[project]
name = "multi-agent-assessment"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",

    # LLM — Groq via OpenAI-compatible client (one SDK, one key)
    "openai>=1.35.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.8.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Task queue
    "celery>=5.3.0",
    "redis>=5.0.0",

    # Embeddings (OpenAI text-embedding-3-small)
    "numpy>=1.26.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jsonschema>=4.22.0",
    "html5lib>=1.1",

    # Code formatting + AST diff
    "black>=24.0.0",
    "libcst>=1.3.0",

    # HTTP client (Judge0)
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Observability
    "langfuse>=2.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "orjson>=3.10.0",
    "passlib[bcrypt]>=1.7.4",
    "shortuuid>=1.0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "agents*",
    "orchestrator*",
    "services*",
    "workers*",
    "db*",
    "observability*",
]
exclude = ["tests*", "frontend*", "prompts*"]